#Nome da pipeline
name: Execução de Testes Basicos

# em que momento será executada
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cypress-run:
    # maquina que será executada
    # só teremos um job: rodar os testes
    runs-on: ubuntu-latest #ultima versao do ubunto

    # passo a passo para rodar os testes
    steps:
      # clone do projeto
      - name: Checkout/Clone do projeto
        uses: actions/checkout@v7

      # exemplo de exeucução no terminal
      - name: Instalar dependencias do projetoS
        run: npm install

      # execução e config do projeto
      - name: Execucao de Testes
        uses: cypress-io/github-action@v5
        with:
          record: true
        env:
          CYPREE_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      # upload do relatório do mocha
      - name: upload relatório
        uses: actions/upload-artifact@v7
        with:
          name: Relatório
          path: cypress/reports/html